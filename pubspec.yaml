name: appsflyer_sdk_plus
description: AppsFlyer plus
version: 0.0.3
homepage: https://github.com/chengmengyi/appsflyer_sdk_plus.git

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: ">=1.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.16.5
  mockito: ^5.4.4
  effective_dart: ^1.3.0


flutter:
  plugin:
    platforms:
      android:
        package: com.appsflyer.appsflyersdk
        pluginClass: AppsflyerSdkPlugin
      ios:
        pluginClass: AppsflyerSdkPlugin
        package: com.appsflyer.appsflyersdk
